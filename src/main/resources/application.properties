# Local build/release orchestrator configuration
# Maximum number of runs retained per pipeline (further triggers are rejected).
orchestrator.max-runs-per-pipeline=100
# Maximum number of artifacts retained per pipeline (oldest unprotected is evicted).
orchestrator.max-artifacts-per-pipeline=20
# Maximum number of global build-cache entries (eviction policy below).
orchestrator.max-cache-entries=50
# Build cache eviction policy: LRU (least recently used) or FIFO (first in first out).
orchestrator.cache-eviction-policy=LRU

logging.level.com.github.h3yow.buildreleaseorchestratorjava=INFO
